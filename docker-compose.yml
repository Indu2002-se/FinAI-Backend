services:

  mysql:
    image: mysql:8.0
    container_name: finai-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_DATABASE: finai_prod
      MYSQL_USER: ${DATABASE_USERNAME}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - finai-network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DATABASE_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: finai-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080

      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/firebase-service-account.json

      DATABASE_URL: jdbc:mysql://mysql:3306/finai_prod?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}

      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro

    networks:
      - finai-network

    ports:
      - "127.0.0.1:8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/api/health/ping"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql_data:
    driver: local

networks:
  finai-network:
    driver: bridge
