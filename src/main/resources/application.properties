# FinAI Backend Application Configuration
spring.application.name=finai-backend

# ===================================================================
# ACTIVE PROFILE
# ===================================================================
# Options: dev, prod, test
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=8082
#server.error.include-message=always
#server.error.include-binding-errors=always
#server.error.include-stacktrace=on_param

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.root=INFO
logging.level.com.finai=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/finai-backend.log

# ===================================================================
# DATABASE CONFIGURATION (Overridden by profile-specific configs)
# ===================================================================
# MySQL connection defaults
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA/HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===================================================================
# SWAGGER/OPENAPI CONFIGURATION
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true

# ===================================================================
# FILE UPLOAD CONFIGURATION
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# ACTUATOR CONFIGURATION
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
